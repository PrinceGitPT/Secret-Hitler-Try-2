    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123b4f"/>
      <stop offset="1" stop-color="#256d8f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="220" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="604" height="184" rx="12" fill="none" stroke="#ddf4ff" stroke-opacity="0.75" stroke-width="2"/>
  <text x="320" y="88" text-anchor="middle" fill="#f4fcff" font-size="38" font-family="Georgia, serif" letter-spacing="3">LIBERAL VICTORY</text>
  <text x="320" y="132" text-anchor="middle" fill="#ddf4ff" font-size="23" font-family="'Trebuchet MS', sans-serif">HITLER WAS EXECUTED</text>
